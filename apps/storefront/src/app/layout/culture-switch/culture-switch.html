<label class="culture-switch">
  <span class="culture-switch-label">{{ label }}</span>
  <select class="culture-switch-select" (change)="onChange($event)" [attr.aria-label]="label">
    @for (culture of cultures; track culture.code) {
      <option [value]="culture.code" [attr.selected]="culture.code === selected ? '' : null">
        {{ culture.displayName }}
      </option>
    }
  </select>
</label>
