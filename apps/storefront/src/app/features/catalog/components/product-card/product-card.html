<article class="product-card">
  <a [routerLink]="['/catalog/products', product.id]">
    @if (displayImage(); as image) {
      <img
        class="product-image"
        [src]="image.imageUrl"
        [attr.alt]="image.altText ?? ''"
        loading="lazy"
        decoding="async"
        (error)="onImageError()"
      />
    } @else {
      <div class="product-image-fallback" aria-hidden="true"></div>
    }
    <h3>{{ product.name }}</h3>
  </a>
</article>
