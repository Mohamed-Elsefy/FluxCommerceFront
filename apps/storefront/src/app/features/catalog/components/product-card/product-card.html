<article class="product-card">
  <a [routerLink]="['/catalog/products', product.id]">
    <div class="media">
      @if (displayImage(); as image) {
        <img
          class="product-image"
          [src]="image.imageUrl"
          [attr.alt]="image.altText ?? ''"
          loading="lazy"
          decoding="async"
          width="400"
          height="400"
          (error)="onImageError()"
        />
      } @else {
        <div class="product-image-fallback" aria-hidden="true"></div>
      }
      <span class="sticker">
        @if (showStatus()) {
          <flux-badge variant="verified">{{ statusLabel }}</flux-badge>
        } @else {
          <flux-badge variant="verified">New</flux-badge>
        }
      </span>
    </div>
    <p class="meta">{{ product.slug }}</p>
    <h3>{{ product.name }}</h3>
    <div class="footer-deck">
      <span class="price">{{ product.categoryId.slice(0, 8) }}</span>
      <span class="btn-quick">View</span>
    </div>
  </a>
</article>
