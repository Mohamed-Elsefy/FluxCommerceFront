<nav class="category-nav" [attr.aria-label]="label">
  <ul>
    @for (category of categories; track category.id) {
      <li>
        <a
          [routerLink]="['/catalog']"
          [queryParams]="{ categoryId: category.id }"
          [attr.aria-current]="category.id === activeCategoryId ? 'page' : null"
          >{{ category.name }}</a
        >
        @if (category.description) {
          <p>{{ category.description }}</p>
        }
      </li>
    }
  </ul>
</nav>
