<nav class="category-nav" [attr.aria-label]="label">
  <ul>
    @for (category of categories; track category.id) {
      <li [attr.data-active]="category.id === activeCategoryId ? '' : null">
        <a
          [routerLink]="[basePath]"
          [queryParams]="{ categoryId: category.id }"
          [attr.aria-current]="category.id === activeCategoryId ? 'page' : null"
          >{{ category.name }}</a
        >
        @if (category.description) {
          <p>{{ category.description }}</p>
        }
        @if (category.id === activeCategoryId && activeContent) {
          <div class="category-active-panel">
            <ng-container *ngTemplateOutlet="activeContent; context: { $implicit: category.id }" />
          </div>
        }
      </li>
    }
  </ul>
</nav>
