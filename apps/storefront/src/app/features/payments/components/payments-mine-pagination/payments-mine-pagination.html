@if (totalPages() > 1) {
  <nav class="pagination" [attr.aria-label]="copy.label">
    <button type="button" [disabled]="disabled || page <= 1" (click)="go(1)">
      {{ copy.first }}
    </button>
    <button type="button" [disabled]="disabled || page <= 1" (click)="go(page - 1)">
      {{ copy.previous }}
    </button>
    @for (number of visiblePages(); track number) {
      <button
        type="button"
        [disabled]="disabled || number === page"
        [attr.aria-current]="number === page ? 'page' : null"
        (click)="go(number)"
      >
        {{ number }}
      </button>
    }
    <button type="button" [disabled]="disabled || page >= totalPages()" (click)="go(page + 1)">
      {{ copy.next }}
    </button>
    <button type="button" [disabled]="disabled || page >= totalPages()" (click)="go(totalPages())">
      {{ copy.last }}
    </button>
  </nav>
}
