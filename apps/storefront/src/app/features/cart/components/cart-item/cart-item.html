<article class="cart-item">
  <div class="cart-item-thumb">
    @if (view.imageUrl !== null) {
      <img
        class="cart-item-image"
        [src]="view.imageUrl"
        [alt]="view.imageAlt"
        loading="lazy"
        decoding="async"
        width="160"
        height="160"
      />
    } @else {
      <div class="cart-item-thumb-fallback" aria-hidden="true"></div>
    }
  </div>
  <div class="cart-item-info">
    <h3 class="cart-item-name">
      <a [routerLink]="['/catalog/products', view.item.productId]">{{ view.item.productName }}</a>
    </h3>
    <dl class="cart-item-meta">
      <div class="cart-item-row">
        <dt>{{ labels.sku }}</dt>
        <dd>{{ view.item.sku }}</dd>
      </div>
      <div class="cart-item-row">
        <dt>{{ labels.unitPrice }}</dt>
        <dd>{{ view.unitPriceText }}</dd>
      </div>
    </dl>
  </div>
  <div class="cart-item-actions">
    <cart-quantity-control
      [quantity]="view.item.quantity"
      [label]="labels.quantity"
      [decreaseLabel]="labels.decrease"
      [increaseLabel]="labels.increase"
      [invalidMessage]="labels.invalidQuantity"
      [errorId]="'cart-quantity-' + view.item.variantId + '-error'"
      [disabled]="disabled"
      (quantityChange)="quantityChange.emit($event)"
    ></cart-quantity-control>
    <button
      type="button"
      class="cart-item-remove"
      (click)="remove.emit()"
      [disabled]="disabled"
      [attr.aria-label]="view.removeLabel"
      [attr.title]="view.removeLabel"
    >
      <svg
        aria-hidden="true"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M3 6h18" />
        <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
        <path d="M19 6 18 20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
        <path d="M10 11v6" />
        <path d="M14 11v6" />
      </svg>
    </button>
  </div>
</article>
