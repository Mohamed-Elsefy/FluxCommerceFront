<h1>Storefront</h1>
<p>Application shell ready. Business features arrive in later phases.</p>

<section aria-labelledby="discovery-title">
  <h2 id="discovery-title">{{ copy().title }}</h2>
  <p>{{ copy().subtitle }}</p>
  <p>
    <a routerLink="/catalog">{{ copy().link }}</a>
  </p>
</section>

<section aria-labelledby="cart-title">
  <h2 id="cart-title">{{ copy().cartTitle }}</h2>
  <p>{{ copy().cartSubtitle }}</p>
  <p>
    <a routerLink="/cart">{{ copy().cartLink }}</a>
  </p>
</section>
