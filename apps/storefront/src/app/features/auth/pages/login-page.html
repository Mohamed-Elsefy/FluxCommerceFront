<section aria-labelledby="login-title">
  <h1 id="login-title">Sign in</h1>
  <p>Access your FluxCommerce account.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="login-email">Email</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.invalid"
        [attr.aria-describedby]="'login-email-errors'"
      />
      <auth-field-errors
        id="login-email-errors"
        [control]="form.controls.email"
        label="Email"
      ></auth-field-errors>
    </div>

    <div>
      <label for="login-password">Password</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.invalid"
        [attr.aria-describedby]="'login-password-errors'"
      />
      <auth-field-errors
        id="login-password-errors"
        [control]="form.controls.password"
        label="Password"
      ></auth-field-errors>
    </div>

    @if (formError() !== null) {
      <flux-error-state
        title="Sign-in failed"
        [message]="formError()"
        [showRetry]="false"
      ></flux-error-state>
    }

    @if (isSubmitting()) {
      <flux-loading-indicator label="Signing in" size="sm"></flux-loading-indicator>
    }

    <button type="submit" [disabled]="isSubmitting()">Sign in</button>
  </form>

  <p>
    New here?
    <a routerLink="/register">Create an account</a>
  </p>
</section>
