@if (sentTo() !== null) {
  <section class="auth-shell" aria-labelledby="forgot-done-title" aria-live="polite">
    <div class="auth-brand">
      <img
        class="auth-brand-logo"
        src="/assets/fluxCommerce-logo.png"
        alt="FluxCommerce"
        width="160"
        height="40"
        loading="lazy"
      />
    </div>
    <div class="auth-done">
      <span class="auth-done-mark" aria-hidden="true">✓</span>
      <h1 id="forgot-done-title" class="auth-title">{{ copy().doneTitle }}</h1>
      <p class="auth-subtitle">{{ doneMessage() }}</p>
    </div>
    <p class="auth-foot">
      <a routerLink="/login">{{ copy().backToLogin }}</a>
    </p>
  </section>
} @else {
  <section class="auth-shell" aria-labelledby="forgot-title">
    <div class="auth-brand">
      <img
        class="auth-brand-logo"
        src="/assets/fluxCommerce-logo.png"
        alt="FluxCommerce"
        width="160"
        height="40"
        loading="lazy"
      />
    </div>
    <h1 id="forgot-title" class="auth-title">{{ copy().title }}</h1>
    <p class="auth-subtitle">{{ copy().subtitle }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="auth-field">
        <label for="forgot-email">{{ copy().emailLabel }}</label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.invalid"
          [attr.aria-describedby]="'forgot-email-errors'"
        />
        <auth-field-errors
          id="forgot-email-errors"
          [control]="form.controls.email"
        ></auth-field-errors>
      </div>

      @if (formError() !== null) {
        <flux-error-state
          [title]="copy().errorTitle"
          [message]="formError()"
          [showRetry]="false"
        ></flux-error-state>
      }

      @if (isSubmitting()) {
        <flux-loading-indicator [label]="copy().submitting" size="sm"></flux-loading-indicator>
      }

      <button type="submit" class="auth-submit" [disabled]="isSubmitting()">
        {{ copy().submit }}
      </button>
    </form>

    <p class="auth-foot">
      {{ copy().remembered }}
      <a routerLink="/login">{{ copy().signInLink }}</a>
    </p>
  </section>
}
