@if (sentTo() !== null) {
  <section aria-labelledby="forgot-done-title" aria-live="polite">
    <h1 id="forgot-done-title">{{ copy().doneTitle }}</h1>
    <p>{{ doneMessage() }}</p>
    <p>
      <a routerLink="/login">{{ copy().backToLogin }}</a>
    </p>
  </section>
} @else {
  <section aria-labelledby="forgot-title">
    <h1 id="forgot-title">{{ copy().title }}</h1>
    <p>{{ copy().subtitle }}</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div>
        <label for="forgot-email">{{ copy().emailLabel }}</label>
        <input
          id="forgot-email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="form.controls.email.invalid"
          [attr.aria-describedby]="'forgot-email-errors'"
        />
        <auth-field-errors
          id="forgot-email-errors"
          [control]="form.controls.email"
        ></auth-field-errors>
      </div>

      @if (formError() !== null) {
        <flux-error-state
          [title]="copy().errorTitle"
          [message]="formError()"
          [showRetry]="false"
        ></flux-error-state>
      }

      @if (isSubmitting()) {
        <flux-loading-indicator [label]="copy().submitting" size="sm"></flux-loading-indicator>
      }

      <button type="submit" [disabled]="isSubmitting()">{{ copy().submit }}</button>
    </form>

    <p>
      {{ copy().remembered }}
      <a routerLink="/login">{{ copy().signInLink }}</a>
    </p>
  </section>
}
