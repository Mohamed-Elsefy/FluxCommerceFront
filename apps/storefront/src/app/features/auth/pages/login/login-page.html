<section aria-labelledby="login-title">
  <h1 id="login-title">{{ copy().title }}</h1>
  <p>{{ copy().subtitle }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div>
      <label for="login-email">{{ copy().emailLabel }}</label>
      <input
        id="login-email"
        type="email"
        formControlName="email"
        autocomplete="email"
        [attr.aria-invalid]="form.controls.email.invalid"
        [attr.aria-describedby]="'login-email-errors'"
      />
      <auth-field-errors
        id="login-email-errors"
        [control]="form.controls.email"
      ></auth-field-errors>
    </div>

    <div>
      <label for="login-password">{{ copy().passwordLabel }}</label>
      <input
        id="login-password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.invalid"
        [attr.aria-describedby]="'login-password-errors'"
      />
      <auth-field-errors
        id="login-password-errors"
        [control]="form.controls.password"
      ></auth-field-errors>
    </div>

    @if (formError() !== null) {
      <flux-error-state
        [title]="copy().errorTitle"
        [message]="formError()"
        [showRetry]="false"
      ></flux-error-state>
    }

    @if (isSubmitting()) {
      <flux-loading-indicator [label]="copy().submitting" size="sm"></flux-loading-indicator>
    }

    <button type="submit" [disabled]="isSubmitting()">{{ copy().submit }}</button>
  </form>

  <p>
    <a routerLink="/forgot-password">{{ copy().forgot }}</a>
  </p>
  <p>
    {{ copy().newHere }}
    <a routerLink="/register">{{ copy().registerLink }}</a>
  </p>
</section>
