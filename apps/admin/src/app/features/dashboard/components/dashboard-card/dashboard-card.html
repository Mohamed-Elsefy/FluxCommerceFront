<flux-card>
  <article class="dashboard-card" [attr.aria-label]="title">
    <div class="dashboard-card-heading">
      <h2 class="dashboard-card-title">{{ title }}</h2>
      @if (badge !== null) {
        <flux-badge [variant]="badgeVariant">{{ badge }}</flux-badge>
      }
    </div>
    <p class="dashboard-card-description">{{ description }}</p>
  </article>
</flux-card>
