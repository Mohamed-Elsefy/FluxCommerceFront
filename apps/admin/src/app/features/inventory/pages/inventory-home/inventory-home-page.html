<section class="inventory-home" aria-labelledby="inventory-title">
  <header class="inventory-home-header">
    <h1 id="inventory-title">{{ copy().title }}</h1>
    <p class="inventory-home-subtitle">{{ copy().subtitle }}</p>
  </header>

  <div class="inventory-home-grid">
    @for (section of copy().sections; track section.title) {
      <flux-card>
        <article class="inventory-home-card" [attr.aria-label]="section.title">
          <div class="inventory-home-card-heading">
            <h2 class="inventory-home-card-title">{{ section.title }}</h2>
            <flux-badge variant="info">{{ copy().upcoming }}</flux-badge>
          </div>
          <p class="inventory-home-card-description">{{ section.description }}</p>
        </article>
      </flux-card>
    }
  </div>
</section>
