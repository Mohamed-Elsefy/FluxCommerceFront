<section class="category-edit" aria-labelledby="category-edit-title">
  <header class="category-edit-header">
    <h1 id="category-edit-title">{{ copy().heading }}</h1>
    <p class="category-edit-subtitle">{{ copy().subheading }}</p>
  </header>

  @if (category().isLoading || category().status === 'idle') {
    <flux-loading-indicator [label]="copy().loading" />
  } @else if (category().isError) {
    <flux-error-state
      [title]="copy().errorTitle"
      [message]="errorMessage()"
      [retryLabel]="copy().retry"
      (retry)="retry()"
    />
  } @else if (initial() !== null) {
    @if (formError() !== null) {
      <flux-error-state
        [title]="copy().formErrorTitle"
        [message]="formError()"
        [showRetry]="false"
      />
    }
    <app-category-form
      [initial]="initial()"
      [parents]="parentOptions()"
      [copy]="formCopy()"
      [submitting]="submitting()"
      (save)="onSave($event)"
      (cancelled)="onCancel()"
    />
  }
</section>
