<section class="variants-list" aria-labelledby="variants-list-title">
  @if (backLink() !== null) {
    <a class="variants-list-back" [routerLink]="backLink()">{{ copy().back }}</a>
  }

  <header class="variants-list-header">
    <div>
      <h1 id="variants-list-title">{{ copy().heading }}</h1>
      <p class="variants-list-subtitle">{{ copy().subheading }}</p>
    </div>
    <a class="variants-list-new" routerLink="new">{{ copy().new }}</a>
  </header>

  @if (slot().isError) {
    <flux-error-state
      [title]="copy().errorTitle"
      [message]="errorMessage()"
      [retryLabel]="copy().retry"
      (retry)="retry()"
    />
  } @else {
    <admin-data-table
      [columns]="columns()"
      [rows]="rows()"
      [loading]="tableLoading()"
      [caption]="copy().caption"
      [emptyTitle]="copy().emptyTitle"
      [emptyMessage]="copy().emptyMessage"
      [loadingLabel]="copy().loading"
    />
  }
</section>
