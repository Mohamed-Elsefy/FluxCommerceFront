<section class="product-edit" aria-labelledby="product-edit-title">
  <header class="product-edit-header">
    <h1 id="product-edit-title">{{ copy().heading }}</h1>
    <p class="product-edit-subtitle">{{ copy().subheading }}</p>
  </header>

  @if (product().isLoading || product().status === 'idle') {
    <flux-loading-indicator [label]="copy().loading" />
  } @else if (product().isError) {
    <flux-error-state
      [title]="copy().errorTitle"
      [message]="errorMessage()"
      [retryLabel]="copy().retry"
      (retry)="retry()"
    />
  } @else if (initial() !== null) {
    @if (formError() !== null) {
      <flux-error-state
        [title]="copy().formErrorTitle"
        [message]="formError()"
        [showRetry]="false"
      />
    }
    @if (lookupError() !== null) {
      <flux-error-state
        [title]="copy().lookupTitle"
        [message]="lookupError()"
        [retryLabel]="copy().retry"
        (retry)="retryLookup()"
      />
    }
    <app-product-form
      [initial]="initial()"
      [categories]="categoryOptions()"
      [visibilityOptions]="visibilityOptions()"
      [copy]="formCopy()"
      [submitting]="submitting()"
      (save)="onSave($event)"
      (cancelled)="onCancel()"
    />
  }
</section>
